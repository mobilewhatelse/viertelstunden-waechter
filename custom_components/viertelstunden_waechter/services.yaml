create_dashboard:
  fields:
    dashboard:
      required: false
      example: "waechter"
      selector:
        text:
export_csv:
  fields:
    kind:
      required: false
      default: quarters
      selector:
        select:
          options:
            - quarters
            - days
    days:
      required: false
      default: 31
      selector:
        number:
          min: 1
          max: 400
          mode: box
    format:
      required: false
      default: standard
      selector:
        select:
          options:
            - standard
            - excel_de
explain_today:
  fields:
    push:
      required: false
      default: false
      selector:
        boolean:
send_week_report:
  fields:
    current_week:
      required: false
      default: false
      selector:
        boolean:
    push:
      required: false
      default: true
      selector:
        boolean:
import_history:
  fields:
    days:
      required: false
      example: '[{"date": "2026-10-01", "kw": 7.8, "at": "18:15"}]'
      selector:
        object:
    months:
      required: false
      example: '[{"month": "2026-10", "peak_kw": 9.1}]'
      selector:
        object:
