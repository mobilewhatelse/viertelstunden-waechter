homeassistant:
  name: Testhaus
  unit_system: metric
  time_zone: Europe/Vienna
  currency: EUR
  country: AT
  language: de

default_config:

logger:
  default: warning
  logs:
    custom_components.viertelstunden_waechter: debug

# Simuliertes Haus: Wallbox, Pool, Hauslast, Netzbezug als geschlossene Schleife
input_number:
  hauslast_w:
    name: Hauslast
    min: 0
    max: 30000
    step: 1
    initial: 400
    unit_of_measurement: W
    mode: box
  akku_ausgang_w:
    name: Akku Ausgangsleistung
    min: 0
    max: 2000
    step: 1
    initial: 800
    unit_of_measurement: W
    mode: box
  wb_strom:
    name: Wallbox Ladestrom
    min: 6
    max: 16
    step: 1
    initial: 16
    unit_of_measurement: A
    mode: box

input_select:
  anker_max_ev_ladestrom:
    name: Max EV Ladestrom
    options: ["6 A", "8 A", "10 A", "12 A", "14 A", "16 A"]
    initial: "16 A"
  auto_ziel_ladestand:
    name: Ziel-Ladestand EV
    options: ["50%", "60%", "70%", "80%", "90%", "100%"]
    initial: "70%"

input_boolean:
  anker_laedt:
    name: Anker laedt
    initial: false
  auto_laedt:
    name: Auto laedt
    initial: false
  pool_pumpe:
    name: Poolpumpe
    initial: true

input_datetime:
  abfahrt:
    name: Abfahrt
    has_date: true
    has_time: true

template:
  - sensor:
      - name: Wallbox Leistung
        unique_id: wb_leistung
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ (states('input_number.wb_strom') | float(6) * 690) if is_state('input_boolean.auto_laedt', 'on') else 0 }}"
      - name: Anker Leistung
        unique_id: anker_leistung
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ ((states('input_select.anker_max_ev_ladestrom') | regex_findall_index('[0-9]+') | float(6)) * 690) if is_state('input_boolean.anker_laedt', 'on') else 0 }}"
      - name: Pool Leistung
        unique_id: pool_leistung
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ 750 if is_state('input_boolean.pool_pumpe', 'on') else 0 }}"
      - name: Netzbezug
        unique_id: netzbezug
        unit_of_measurement: W
        state_class: measurement
        state: "{{ states('input_number.hauslast_w') | float(0) + states('sensor.wallbox_leistung') | float(0) + states('sensor.pool_leistung') | float(0) + states('sensor.anker_leistung') | float(0) + (now().minute % 2) }}"
      - name: Netzbezug still
        unique_id: netzbezug_still
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "500"
      - name: Netz ohne Einheit
        unique_id: netz_ohne_einheit
        state: "100"
      - name: Akku Ladestand
        unique_id: akku_soc
        unit_of_measurement: "%"
        state: "70"
      - name: Auto Ladestand
        unique_id: auto_soc
        unit_of_measurement: "%"
        state: "40"
      - name: Test Ladeplan
        unique_id: test_ladeplan
        state: "planned"
        attributes:
          departure: "{{ (now() + timedelta(hours=10)).isoformat() }}"
          windows: >
            {% set s = now().replace(minute=0, second=0, microsecond=0) + timedelta(hours=2) %}
            {{ [{'start': s.isoformat(), 'end': (s + timedelta(hours=1)).isoformat(), 'energy_kwh': 8.0, 'peak_kw': 11.0}] }}
